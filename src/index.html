<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Directory Tree Generator</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="section">
            <label>Directories to Scan:</label>
            <div class="list-container" id="dirs-drop-area">
                <ul id="directories-list" class="path-list"></ul>
                <div class="button-column">
                    <button id="add-dir-btn">Add Folders</button>
                    <button id="remove-dir-btn">Remove Selected</button>
                </div>
            </div>
        </div>

        <div class="section">
            <label>Allowed Extensions:</label>
            <div class="list-container">
                <ul id="extensions-list" class="path-list"></ul>
                <div class="button-column">
                    <button id="remove-ext-btn">Remove Selected</button>
                </div>
            </div>
            <div class="entry-row">
                <input type="text" id="ext-entry" placeholder="e.g., .js or .txt">
                <button id="add-ext-btn">Add Extension</button>
            </div>
        </div>

        <div class="section">
            <label>Block Paths and Files (shows name only):</label>
            <p>Blocks folder contents and file contents for the paths listed below.</p>
            <div class="list-container config-drop-area" data-list-id="blocked-paths-list">
                <ul id="blocked-paths-list" class="path-list"></ul>
                <div class="button-column">
                    <button class="add-btn" data-type="folder">Add Folders</button>
                    <button class="add-btn" data-type="file">Add Files</button>
                    <button class="delete-btn">Delete Selected</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="live-toggle-container">
                <label for="live-monitor-toggle" title="Automatically regenerate the tree when source files change.">Live Monitoring</label>
                <input type="checkbox" id="live-monitor-toggle">
            </div>
            <button id="save-config-btn">Save Config</button>
            <button id="load-config-btn">Load Config</button>
            <button id="generate-btn">Generate Tree</button>
        </div>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
